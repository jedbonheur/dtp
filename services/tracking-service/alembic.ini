# Alembic Configuration File
# This file contains settings for database migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want custom migration naming patterns
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# useful for relative imports of migration files
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by Alembic
# when asking for the initial migration message
# Uncomment the line below if you want custom slug length
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# on_version_change = false

# When using the revision command with autogenerate,
# what kind of files do you want-- when?
# PLAINTEXT format, SCRIPT format, or None
# as set in file_template. Set the these on if you want to have version files
# to which the migration scripts (those .py files) will refer to.
# compare_type = false
# compare_server_default = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S