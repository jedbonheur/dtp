services:
  postgres:
    image: postgres:16
    container_name: dtp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtp}
      POSTGRES_DB: ${POSTGRES_DB:-dtp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dtp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: dtp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: dtp-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${PANDAPROXY_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 15

  redpanda-console:
    image: redpandadata/console:latest
    container_name: dtp-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"

volumes:
  dtp_postgres_data: {}